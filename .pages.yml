# Pages CMS configuration
# Admin UI lives at https://app.pagescms.org — sign in with GitHub and open this repo.
# Edits here are committed straight to your repository; a rebuild then redeploys the site.
# Docs: https://pagescms.org/docs/

media: public/media

content:
  - name: schedule
    label: Đặt lịch
    type: collection
    path: src/content/schedule
    filename: '{fields.title}.md'
    view:
      primary: title
      fields: [title, type, recurrence, date, lunarDay, lunarMonth]
    fields:
      - name: title
        label: Tiêu đề (Title)
        type: string
        required: true
      - name: type
        label: Loại sự kiện (Event type)
        type: select
        required: true
        description: Sinh nhật tự chuyển "Lặp lại" thành Hằng năm dương lịch; Giỗ tự chuyển thành Hằng năm âm lịch.
        options:
          values:
            - name: memorial
              label: Giỗ
            - name: birthday
              label: Sinh nhật
            - name: wedding
              label: Đám cưới
            - name: custom
              label: Khác (Custom)
          default: custom
      - name: recurrence
        label: Lặp lại (Recurrence)
        type: select
        description: Tự động theo loại sự kiện — Sinh nhật = hằng năm, Giỗ = hằng năm âm lịch.
        options:
          values:
            - name: once
              label: Một lần (Once)
            - name: yearly
              label: Hằng năm - dương lịch (Yearly, solar)
            - name: lunar-yearly
              label: Hằng năm - âm lịch (Yearly, lunar)
      - name: date
        label: Dương lịch
        type: date
        options:
          format: dd-MM-yyyy
        default: ""
      - name: lunarDay
        label: Ngày âm
        type: number
        default: ""
      - name: lunarMonth
        label: Tháng âm
        type: number
        default: ""
      - name: note
        label: Ghi chú (Note)
        type: text